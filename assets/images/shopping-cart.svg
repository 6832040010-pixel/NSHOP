<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <ellipse cx="300" cy="645" rx="210" ry="26" fill="#020617" opacity="0.65"/>
  <!-- Stainless Shopping Cart -->
  <polygon points="150,280 465,280 425,470 185,470" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linejoin="round"/>
  <line x1="165" y1="340" x2="452" y2="340" stroke="#94a3b8" stroke-width="5"/>
  <line x1="175" y1="405" x2="438" y2="405" stroke="#94a3b8" stroke-width="5"/>
  <line x1="245" y1="280" x2="255" y2="470" stroke="#94a3b8" stroke-width="4"/>
  <line x1="320" y1="280" x2="320" y2="470" stroke="#94a3b8" stroke-width="4"/>
  <line x1="395" y1="280" x2="380" y2="470" stroke="#94a3b8" stroke-width="4"/>
  <!-- Handle & Chassis -->
  <path d="M150 280 L115 215 L175 215" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"/>
  <path d="M185 470 L170 570 L435 570" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
  <!-- Wheels -->
  <circle cx="195" cy="605" r="28" fill="#334155" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="415" cy="605" r="28" fill="#334155" stroke="#94a3b8" stroke-width="5"/>
  <!-- Stackable Basket -->
  <polygon points="240,510 385,510 370,562 255,562" fill="#f59e0b" opacity="0.9"/>
  <text x="300" y="700" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="bold">SHOPPING CART &amp; BASKETS</text>
</svg>